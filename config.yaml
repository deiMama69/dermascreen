# Zentrale Konfiguration für die gesamte Pipeline.
# Alle Skripte lesen diese Datei via --config config.yaml.

paths:
  raw_dir: "data/raw"                 # heruntergeladene Rohbilder
  metadata_csv: "data/raw/metadata.csv"        # komplette ISIC-Metadaten
  filtered_csv: "data/raw/metadata_filtered.csv"  # nach Fitzpatrick + klinisch gefiltert
  splits_dir: "data/splits"          # train/val/test-Manifeste (CSV)
  models_dir: "models"               # gespeicherte Keras-/TFLite-Modelle

isic:
  # PAD-UFES-20 wird über die ISIC-Archive-Collection 406 bezogen: dieselben
  # klinischen Smartphone-Fotos, aber über einen zuverlässigen, automatisierbaren
  # Host — inklusive Label (diagnosis_1) und patient_id für den Patienten-Split.
  api_base: "https://api.isic-archive.com/api/v2"
  collection_id: 406                 # 406 = PAD-UFES-20 (klinische Aufnahmen)
  page_limit: 100                    # Einträge pro API-Seite
  token: ""                          # optional; leer = anonymer Zugriff

filter:
  # --- Label: ISIC-Feld diagnosis_1 ("Benign" / "Malignant") ---
  label_field: "diagnosis_1"
  malignant_values: ["Malignant"]
  benign_values: ["Benign"]
  # "Indeterminate" oder leere Labels werden verworfen.
  # --- Nur klinische Aufnahmen (in Collection 406 ohnehin alle) ---
  image_type_field: "image_type"
  image_type_keep_substring: "clinical"   # verwirft evtl. dermatoskopische Bilder
  image_id_field: "img_id"           # Dateiname, z. B. ISIC_0601025.jpg
  # Hinweis: Fitzpatrick ist über die ISIC-API nicht verfügbar. Der Datensatz ist
  # aber zu ~97 % heller Hauttyp (nur 73 von 2298 Bildern sind Typ IV–VI).

split:
  test_size: 0.15
  val_size: 0.15                     # Anteil des verbleibenden Trainings
  group_field: "patient_id"          # Split auf Patientenebene -> kein Leakage
  random_state: 42

data:
  img_size: 224                      # 224 für B0, 380 für B4
  batch_size: 16                     # 16 = schonend für 16 GB RAM / CPU-Training
  # Augmentation zur Simulation von Alltags-/Smartphone-Bedingungen
  aug:
    rotation_deg: 25
    zoom: 0.15
    brightness: 0.15
    contrast: 0.15
    hue: 0.05
    saturation: 0.2
    blur_prob: 0.3
    blur_max_sigma: 1.5

model:
  backbone: "B0"                     # "B0" oder "B4"
  dropout: 0.3

train:
  # Phase 1: nur den neuen Kopf trainieren (Backbone eingefroren)
  head_epochs: 8
  head_lr: 1.0e-3
  # Phase 2: Fine-Tuning der oberen Backbone-Layer
  finetune_epochs: 25
  finetune_lr: 1.0e-5
  finetune_unfreeze: 40              # Anzahl der obersten Layer, die aufgetaut werden
  label_smoothing: 0.05
  early_stopping_patience: 6
  monitor: "val_auc"                 # bester Checkpoint nach val-AUC
  use_class_weight: true             # Class-Imbalance ausgleichen

evaluate:
  target_sensitivity: 0.95           # Betriebs-Schwellenwert wird darauf kalibriert

export:
  quantization: "float16"            # "float16" | "int8" | "none"
  rep_dataset_size: 200              # Kalibrierungs-Samples für int8
